		table 
		{
			/* Убирает двойные границы между ячейками, делая их единой сеткой */
			border-collapse: collapse;
			/* Задает голубой фоновый цвет для всей таблицы (цвет неба) */
			background-color: #33d6ff;
			/* Создает очень толстую (200 пикселей) белую внешнюю рамку вокруг рисунка */
			border: 200px solid #ffffff;
			/* Центрирует таблицу на странице и создает отступ в 200 пикселей сверху и снизу */
			margin: 200px auto;
		}

		td 
		{
			/* Фиксированный размер для сетки */
			width: 150px;
			height: 40px;
			/* Светло-голубая сетка */
			border: 1px solid #5ce6ff;
			padding: 0;
		}
		/* Цвета пикселей */
		.sky 
		{
			background-color: #33d6ff;
		}
		/* Небо */
		.sun 
		{
			background-color: #ffff00;
		}
		/* Солнце */
		.mast 
		{
			background-color: #555500;
		}
		/* Мачта / палуба */
		.sail 
		{
			background-color: #ff0000;
		}
		/* Парус */
		.deck 
		{
			background-color: #512b00;
		}
		/* Бортик палубы */
		.hull 
		{
			background-color: #663300;
		}
		/* Корпус */
		.sea 
		{
			background-color: #0044cc;
		}
		/* Море */

		/*Черный цвет для людей*/
		.human 
		{
			background: linear-gradient(to right, #555500 35%, #000000 35%, #000000 65%, #555500 65%);
		}
	</style>
</head>
